# A friendly name for the workflow, shown in the GitHub Actions tab.
name: Build Ginkgo Kernel (KernelSU)

# Controls when the action will run.
on:
  # Allows you to run this workflow manually from the Actions tab.
  workflow_dispatch:
  # Triggers the workflow on push events to the main branch.
  push:
    branches:
      - main

jobs:
  build:
    # A friendly name for the job.
    name: Build Kernel on ARM64
    # This job runs on an emulated ARM64 environment.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build the Kernel
        run: |
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          export CCACHE_DIR=~/.ccache
          bash do_build.sh ginkgo c k R

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Ginkgo-${{ github.sha }}
          path: /home/runner/work/flop_trinket-mi_kernel/*ginkgo*.zip
